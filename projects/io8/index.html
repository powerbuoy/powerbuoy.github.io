<!DOCTYPE html>

<html lang="en" class="paused">

	<head>

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>IO8</title>
		<link rel="icon" href="data:;base64,iVBORw0KGgo=">
		<style>
			:root {
				/* Colors */
				--background: #000;
				--foreground: #fff;
				--accent: #cbb570;
				--card-background: rgb(0 0 0 / 0.35);

				/* Spacing */
				--ui-padding: 2.5%;
				--card-padding: 1rem;
				--card-radius: 0.25rem;
			}

			/* Base */
			html {
				background-color: var(--background);
				font: 100% / 1.8 system-ui;
				color: var(--foreground);
			}

			body {
				margin: 0;
			}

			h1,
			h2 {
				font: bolder clamp(4rem, 15vw, 10rem)/1 system-ui;
				letter-spacing: -0.025em;
				text-transform: uppercase;
				margin: 0 0 1rem;
			}

			aside h2 {
				font-size: 1.5rem;
			}

			p {
				margin: 0 0 1rem;
			}

			a {
				color: var(--accent);
				text-decoration: none;
				cursor: pointer;
			}

			output {
				font-weight: 900;
			}

			/* Start & end menu */
			#start,
			#end {
				position: fixed;
				inset: 0;
				z-index: 98;

				display: none;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;

				text-align: center;

				> a {
					display: block;
					font-size: 2.5rem;
					line-height: 1;
					font-weight: bold;
					text-transform: uppercase;
					transition: scale 0.2s ease;

					&:hover {
						scale: 1.2;
					}
				}

				p {
					margin: 1rem 0 0;
				}
			}

			/* Start menu */
			#start {
				background: var(--card-background);
				padding: var(--ui-padding);

				> aside {
					background: var(--card-background);
					padding: 2rem;
					margin-top: 2rem;
					border-radius: var(--card-radius);

					> :last-child {
						margin-bottom: 0;
					}
				}
			}

			html.paused #start {
				display: flex;
			}

			/* End menu */
			#end {
				> h2 {
					color: red;
				}
			}

			html.dead #end {
				display: flex;
			}

			/* UI */
			#ui {
				/* Each UI card */
				& > * {
					background: var(--card-background);
					padding: var(--card-padding);
					border-radius: var(--card-radius);

					position: fixed;
					z-index: 99;

					font-size: 0.75rem;

					& > :last-child {
						margin-bottom: 0;
					}
				}

				/* Top left */
				& > :nth-of-type(1) {
					top: var(--ui-padding);
					left: var(--ui-padding);
				}

				/* Top center */
				& > :nth-of-type(2) {
					top: var(--ui-padding);
					left: 50%;
					transform: translateX(-50%);
				}

				/* Top right */
				& > :nth-of-type(3) {
					top: var(--ui-padding);
					right: var(--ui-padding);
				}

				/* Bottom right */
				& > :nth-of-type(4) {
					bottom: var(--ui-padding);
					right: var(--ui-padding);
				}

				/* Bottom center */
				& > :nth-of-type(5) {
					bottom: var(--ui-padding);
					left: 50%;
					transform: translateX(-50%);
				}

				/* Bottom left */
				& > :nth-of-type(6) {
					bottom: var(--ui-padding);
					left: var(--ui-padding);
				}

				/* Hide empty cards, cards whose items are all hidden (no power-ups running) and the loader once done */
				& > :empty,
				& > [hidden],
				& > :not(:has(> :not([hidden]))) {
					display: none;
				}
			}

			/* HUD items: a label with a name and a meter, updated by the game through data-stat */
			[data-stat] {
				display: block;
				margin: 0 0 0.5rem;

				& meter {
					display: block;
				}
			}

			/* Otherwise a display rule like the one above wins over the hidden attribute */
			[hidden] {
				display: none !important;
			}

			/* Game */
			#game {
				position: fixed;
				inset: 0;
				z-index: 98;
				margin: 0;

				/* io8's head follows the mouse, so it's an aiming reticle */
				cursor: crosshair;

				> canvas {
					position: absolute;
					inset: 0;
				}
			}
		</style>

	</head>

	<body>

		<figure id="game"></figure>

		<section id="start">

			<h1>IO8</h1>

			<a role="button" data-action="play">Play</a>
			<a role="button" data-action="restart">Restart</a>

			<p>WASD: drive / fly / brake<br>Space: jump<br>Click: fire</p>

		</section>

		<section id="end">

			<h2>Does not compute</h2>

			<a role="button" data-action="restart">Restart</a>

		</section>

		<section id="ui">

			<!-- Top left -->
			<article id="loading">

				<p>Loading <output>0%</output></p>

			</article>

			<!-- Top center -->
			<article></article>

			<!-- Top right -->
			<article></article>

			<!-- Bottom right -->
			<article>

				<label data-stat="speed" hidden>
					Super speed <span data-val>(%ss)</span>
					<meter value="1" low="0.25" high="0.5" optimum="1"></meter>
				</label>

				<label data-stat="weight" hidden>
					Super weight <span data-val>(%ss)</span>
					<meter value="1" low="0.25" high="0.5" optimum="1"></meter>
				</label>

			</article>

			<!-- Bottom center -->
			<article></article>

			<!-- Bottom left -->
			<article>

				<label data-stat="health">
					Health <span data-val>(%s%)</span>
					<meter value="1" low="0.25" high="0.5" optimum="1"></meter>
				</label>

				<label data-stat="fuel">
					Fuel <span data-val>(%s%)</span>
					<meter value="1" low="0.25" high="0.5" optimum="1"></meter>
				</label>

				<label data-stat="ammo">
					Ammo <span data-val>(%s%)</span>
					<meter value="1" low="0.25" high="0.5" optimum="1"></meter>
				</label>

			</article>

		</section>

		<!-- Libraries live in lib/ (three.js 0.186.1, Rapier 0.20.0), this maps the names the code imports to them -->
		<script type="importmap">
			{
				"imports": {
					"three": "./lib/three/build/three.module.js",
					"three/addons/": "./lib/three/examples/jsm/",
					"@dimforge/rapier3d-compat": "./lib/rapier/rapier.mjs"
				}
			}
		</script>

		<script type="module" src="./src/main.js"></script>

	</body>

</html>
