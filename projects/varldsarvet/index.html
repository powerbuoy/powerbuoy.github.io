<!DOCTYPE html>

<html lang="sv">

	<head>

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Världsarvet coverband, Kyrkbyn">

		<title>Världsarvet</title>

		<style>
			/* Fonts */
			@font-face {
				font-family: "Metal Mania";
				font-style: normal;
				font-weight: normal;
				font-display: swap;
				src: url("assets/fonts/metal-mania.woff2") format("woff2");
			}

			@font-face {
				font-family: "Barlow";
				font-style: normal;
				font-weight: normal;
				font-display: swap;
				src: url("assets/fonts/barlow-400.woff2") format("woff2");
			}

			@font-face {
				font-family: "Barlow";
				font-style: normal;
				font-weight: bold;
				font-display: swap;
				src: url("assets/fonts/barlow-700.woff2") format("woff2");
			}

			/* Variables */
			:root {
				/* Layout */
				--site-width-min: 85vw;
				--site-width-max: 960px;
				--site-width: min(var(--site-width-min), var(--site-width-max));
				--site-padding: calc((100vw - var(--site-width)) / 2);

				/* Colors */
				--bg-color: light-dark(white, black);
				--text-color: light-dark(black, white);

				/* Typography */
				--font-body: Barlow, Helvetica, sans-serif;
				--font-heading: "Metal Mania", var(--font-body);
			}

			* {
				box-sizing: border-box;
			}

			/* Base */
			html {
				color-scheme: dark;
				background-color: var(--bg-color);
				color: var(--text-color);
				font: 100%/1.6 var(--font-body);
			}

			body {
				margin: 0;
			}

			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				font: 6rem/1 var(--font-heading);
				margin: 0 0 1.5rem;
			}

			h2 {
				font-size: 5rem;
			}

			h3 {
				font-size: 2rem;
			}

			p {
				margin: 0 0 1rem;
				max-width: 75ch;
			}

			figure {
				margin: 0 0 1rem;

				img {
					display: block;
					width: 100%;
					height: auto;
				}
			}

			img {
				max-width: 100%;
			}

			/* Header */
			body > header {
				margin: 2rem var(--site-padding);

				h1 {
					margin: 0;

					img {
						display: block;
						width: min(50%, 20rem);
						height: auto;
						margin-inline: auto;

						/* The logo is a single-color SVG, so filters can recolor it to match the text */
						filter: brightness(0);

						@media (prefers-color-scheme: dark) {
							filter: brightness(0) invert(1);
						}

						/* Fixed dark mode for now */
						filter: brightness(0) invert(1);
					}
				}
			}

			/* All sections */
			section {
				margin: 5rem var(--site-padding);
				text-align: center;

				p {
					margin-inline: auto;
				}
			}

			/* About */
			#about {
			}

			/* Band */
			#band {
				> div {
					display: grid;
					grid-template-columns: repeat(auto-fit, minmax(6rem, 1fr));
					gap: 3rem;
				}

				figure {
					margin: 0;

					img {
						aspect-ratio: 1/1;
						object-fit: contain;
						border-radius: 50%;
						margin-bottom: 1rem;
						border: 0.5rem solid var(--text-color);
					}

					h3 {
						margin-bottom: 0;
					}

					h3 + p {
						margin-bottom: 0.5rem;
					}

					small {
						text-transform: uppercase;
					}
				}
			}

			/* Gallery */
			#gallery {
				figure {
					margin: 0;
					display: grid;
					grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));

					a {
						display: block;
						overflow: hidden;

						img {
							display: block;
							aspect-ratio: 1 / 1;
							object-fit: cover;
							transition: scale 1.2s ease;

							&:hover {
								scale: 1.2;
							}
						}
					}
				}
			}

			/* Footer */
			body > footer {
				margin: 2rem var(--site-padding);
				text-align: center;
				font-size: smaller;
				text-transform: uppercase;

				p {
					margin-inline: auto;
				}
			}
		</style>

	</head>
